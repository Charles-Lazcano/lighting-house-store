<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Navy background gradient matching the site -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12325c"/>
      <stop offset="1" stop-color="#0a1e3d"/>
    </linearGradient>
    <!-- Warm glow behind the bulb -->
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffc23d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffc23d" stop-opacity="0"/>
    </radialGradient>
    <!-- Glass of the bulb -->
    <radialGradient id="glass" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="0.55" stop-color="#ffcf47"/>
      <stop offset="1" stop-color="#f5a623"/>
    </radialGradient>
  </defs>

  <!-- Rounded square backdrop -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Soft light halo -->
  <circle cx="256" cy="215" r="185" fill="url(#glow)"/>

  <!-- Light rays -->
  <g stroke="#ffd257" stroke-width="18" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="34"  x2="256" y2="74"/>
    <line x1="118" y1="90"  x2="146" y2="118"/>
    <line x1="394" y1="90"  x2="366" y2="118"/>
    <line x1="60"  y1="210" x2="100" y2="210"/>
    <line x1="452" y1="210" x2="412" y2="210"/>
  </g>

  <!-- Bulb glass -->
  <path d="M256 96
           c-79 0 -134 58 -134 128
           c0 48 27 80 52 106
           c15 15 22 28 24 46
           l116 0
           c2 -18 9 -31 24 -46
           c25 -26 52 -58 52 -106
           c0 -70 -55 -128 -134 -128 z"
        fill="url(#glass)" stroke="#e0951a" stroke-width="6"/>

  <!-- Filament -->
  <path d="M256 176 l-24 60 l48 0 l-24 60"
        fill="none" stroke="#c9791a" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Screw base -->
  <g fill="#cfd6de" stroke="#9aa3ad" stroke-width="4">
    <rect x="212" y="382" width="88" height="26" rx="8"/>
    <rect x="216" y="410" width="80" height="24" rx="8"/>
    <path d="M226 436 q30 34 60 0 z" fill="#8a919b" stroke="none"/>
  </g>
</svg>
